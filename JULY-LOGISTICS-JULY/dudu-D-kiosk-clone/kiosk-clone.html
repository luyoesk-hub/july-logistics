<!doctype html>
<!--
  두두택배 접수 키오스크 - 실물 클론 (Route 방식)

  근거: CUpost(cupost.co.kr) 실물 화면 실측 260806
    1) main.cupost - 배송조회 + 서비스 카드
    2) selectReservation.cupost - 택배 예약하기 / 서비스 4종 선택
    3) reservationAgree.cupost - 비회원 접수: 약관 3건 동의 + 비밀번호 설정
    캡처 = ../caps/cupost_01_main.png, cupost_02_service.png, cupost_03_agree.png
    4단계 이후는 로그인 벽 뒤라 실물 캡처가 없다. 일반적인 택배 접수 순서로 채웠다.

  요금/권역/금지품목 = infra/day14-starter/02_접수규정.md 실측 인용. 지어낸 정책 없음.

  Route: 해시 라우터. #/service #/agree #/sender #/receiver #/item #/fee #/done
  뒤로 가기가 동작한다(브라우저 히스토리).

  [260807 정답본(canonical) 검증·수리 - 학생 9명 배포 기준]
    - 운송장 번호: 규정 §9(10자리 = 지점코드2 + 순번8)와 달리 12자리 의사난수(지점 무관, 중복검사 없음)였다.
      실측 - 동일 틱에서 5회 연속 호출해도 완전히 같은 값이 나옴(중복 방지 0). makeWaybill()로 교체 -
      BRANCH_CODE(지점코드) + localStorage 누적 순번 8자리 = 총 10자리, 중복 방지.
    - 도착 예정일: 고정 문구("다음 영업일" 등)만 있고 실제 날짜 계산이 없었다(setup.sql의 eta_date 칸에
      대응하는 값을 만들지 못했다). etaFor()/addBizDays() 추가 - 규정 §6대로 토·일 제외 영업일 계산,
      done 화면에 실제 날짜를 기존 고정 문구와 함께 병기.
    - 요금표 12종(4등급x3권역), 등급판정 8단계 순서, 한 등급 상향 규칙, 금지품목 7분류, 대형 한도 초과
      거절, 진주/거제 일반권역 처리는 실측 검증 결과 이미 규정과 일치 - 값 수정 없음.
    - DB 저장 칸 대응 확인(setup.sql 기준) - sender.tel/branch, receiver.tel/addr, calc.vol(부피무게)은
      대응 칸이 없다(receiver_phone도 setup.sql엔 없음). 이 파일에는 애초에 DB insert 코드가 없어 저장
      시도 자체가 발생하지 않는다 - 아래 S 선언부 주석으로 명시(추후 Supabase 연동 시 저장 대상에서 제외).
    검증 근거 = ../CANONICAL_검증표.md
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>두두택배 접수</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#eef1f5;color:#1a1a1a;
       display:flex;justify-content:center;padding:16px}
  .kiosk{width:100%;max-width:520px;background:#fff;border-radius:14px;overflow:hidden;
         box-shadow:0 4px 24px rgba(0,0,0,.10);display:flex;flex-direction:column;min-height:720px}
  header{background:#5b2d8e;color:#fff;padding:16px 20px}
  header .brand{font-size:20px;font-weight:800;letter-spacing:-.5px}
  header .sub{font-size:12px;opacity:.85;margin-top:2px}

  .ok .no{font-size:26px;font-weight:800;letter-spacing:1px;margin:14px 0;color:#5b2d8e}

  table.rate{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}

  table.rate th{background:#f4f2f8}
  table.rate tr.hit td{background:#efe7fb;font-weight:700}
</style>
</head>
<body>
<div class="kiosk">
  <header>
    <div class="brand">두두택배</div>
    <div class="sub">코스모스웍스 · 접수 키오스크</div>
  </header>
  <div class="steps" id="steps"></div>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<script>
// ---------- 접수규정 (02_접수규정.md 실측 인용) ----------
var RATE = [
  { grade:'극소형', sum:60,  wt:2,  fee:{ 일반:3500, 제주:6500, 도서산간:8500  } },
  { grade:'소형',   sum:80,  wt:5,  fee:{ 일반:4000, 제주:7000, 도서산간:9000  } },
  { grade:'중형',   sum:120, wt:15, fee:{ 일반:6000, 제주:9000, 도서산간:11000 } },
  { grade:'대형',   sum:160, wt:25, fee:{ 일반:9000, 제주:12000, 도서산간:14000 } }
];
var BANNED = {
  '금전':['현금','상품권','유가증권'],
  '귀중품':['금','은','보석','시계'],
  '인화성':['라이터','부탄가스','페인트','신나','알코올'],
  '배터리':['보조배터리','리튬배터리'],
  '생물':['동물','식물'],
  '온도':['냉장','냉동'],
  '기타':['주류','의약품','총포','도검']
};
var ZONES = ['일반','제주','도서산간'];
var BRANCHES = ['서울','용산','대전','진주','거제','울산'];
var BRANCH_CODE = { '서울':'11','용산':'12','대전':'21','진주':'31','거제':'32','울산':'41' }; // 접수규정 §1 지점 코드

// ---------- 상태 ----------
// DB 칸 대응 확인(setup.sql 기준): sender.tel, sender.branch, receiver.tel, receiver.addr, calc.vol(부피무게)는
// setup.sql의 shipments 표에 대응 칸이 없다(receiver_phone 칸도 setup.sql엔 없음 - historical CSV에만 있던 칸).
// 이 파일에는 애초에 DB insert 코드가 없다(Supabase 연동 없음) - 화면은 값을 받아 보여주기만 한다.
// 나중에 저장 기능을 붙일 때는 이 값들을 저장 대상에서 빼거나(현재 기본) 별도 칸을 새로 만들어야 한다.
var S = { service:'', agree:false, sender:{}, receiver:{}, item:{}, calc:null, waybill:'' };

// ---------- 요금 계산 ----------
function calcFee(it){
  var w = Number(it.w)||0, h = Number(it.h)||0, d = Number(it.d)||0;
  var real = Number(it.weight)||0;
  var vol = (w*h*d)/6000;                 // 부피 무게
  var chargeWt = Math.max(real, vol);     // 요금 무게 = 둘 중 큰 값
  var sum = w+h+d;                        // 세 변의 합
  // 크기와 무게 중 하나라도 넘으면 다음 등급
  var g = null;
  for (var i=0;i<RATE.length;i++){
    if (sum <= RATE[i].sum && chargeWt <= RATE[i].wt) { g = RATE[i]; break; }
  }
  if (!g) return { over:true, sum:sum, chargeWt:chargeWt, vol:vol, real:real };
  // 권역이 텍스트 입력이라 셋 중 하나가 아닌 값이 올 수 있다. 그때는 일반으로 계산한다.
  var zk = normZone(it.zone);
  return { over:false, grade:g.grade, fee:g.fee[zk], sum:sum, chargeWt:chargeWt, vol:vol, real:real, zone:zk };
}
// 권역 정규화 - ZONES에 없으면 일반. 260807 select를 텍스트 입력으로 바꾸면서 추가.
function normZone(z){ return ZONES.indexOf(z) >= 0 ? z : '일반'; }
function bannedHit(name){
  var hits = [];
  for (var k in BANNED) BANNED[k].forEach(function(x){ if (name && name.indexOf(x) !== -1) hits.push(k+' / '+x); });
  return hits;
}

// ---------- 운송장 번호 채번 (접수규정 §9: 10자리 = 지점코드 2자리 + 접수순번 8자리, 절대 겹치면 안 됨) ----------
function nextSeq(branchCode){
  var key = 'dudu_seq_' + branchCode;
  var n;
  try {
    n = (parseInt(localStorage.getItem(key), 10) || 0) + 1;
    localStorage.setItem(key, String(n));
  } catch (e) {
    // localStorage를 못 쓰는 환경(프라이빗 모드 등) 대비 메모리 폴백
    window.__seqMem = window.__seqMem || {};
    window.__seqMem[key] = (window.__seqMem[key] || 0) + 1;
    n = window.__seqMem[key];
  }
  return n;
}
function makeWaybill(branchName){
  var code = BRANCH_CODE[branchName] || '00';
  var seq = String(nextSeq(code));
  while (seq.length < 8) seq = '0' + seq;
  return code + seq; // 지점코드 2자리 + 접수순번 8자리 = 총 10자리
}

// ---------- 도착 예정일 계산 (접수규정 §6: 영업일 기준, 토·일 제외) ----------
var ETA_DAYS = { '일반':1, '제주':2, '도서산간':3 };
function addBizDays(base, n){
  var d = new Date(base.getTime());
  var added = 0;
  while (added < n) {
    d.setDate(d.getDate() + 1);
    var dow = d.getDay(); // 0=일요일, 6=토요일
    if (dow !== 0 && dow !== 6) added++;
  }
  return d;
}
function fmtDate(d){
  var y = d.getFullYear();
  var m = String(d.getMonth()+1); if (m.length<2) m='0'+m;
  var day = String(d.getDate()); if (day.length<2) day='0'+day;
  return y+'-'+m+'-'+day;
}
function etaFor(zone){
  var n = ETA_DAYS[normZone(zone)];
  if (!n) return '-';
  return fmtDate(addBizDays(new Date(), n));
}

// ---------- 라우터 ----------
var ROUTES = ['service','agree','sender','receiver','item','fee','done'];
var LABEL  = { service:'서비스', agree:'동의', sender:'보내는 분', receiver:'받는 분', item:'물품', fee:'요금', done:'완료' };

function go(r){ location.hash = '#/' + r; }
function cur(){ var h=(location.hash||'').replace('#/',''); return ROUTES.indexOf(h)>=0 ? h : 'service'; }

window.addEventListener('hashchange', render);
window.addEventListener('load', function(){ if(!location.hash) location.hash='#/service'; render(); });

function drawSteps(){
  var c = cur(), i = ROUTES.indexOf(c);
  document.getElementById('steps').innerHTML = ROUTES.slice(0,6).map(function(r,j){
    var cls = j===i ? 'on' : (j<i ? 'done' : '');
    return '<div class="'+cls+'">'+LABEL[r]+'</div>';
  }).join('');
}

function render(){
  var c = cur();
  drawSteps();
  var v = document.getElementById('view'), n = document.getElementById('nav');
  v.innerHTML = VIEW[c](); n.innerHTML = NAV[c]();
  if (BIND[c]) BIND[c]();
}

// ---------- 화면 ----------
var VIEW = {

service: function(){ return ''
  + '<h2>택배 예약하기</h2>'
  + '<p class="guide">보내실 방법을 선택하세요.</p>'
  + [['국내택배','원하는 주소로 배송'],
     ['내일보장택배','18시 전 접수 시 다음날 도착 (수도권)'],
     ['반값택배','두두택배 지점으로 배송 (3일 내)'],
     ['국제택배','국내에서 해외로 배송']]
    .map(function(s,i){ return '<div class="card" data-s="'+s[0]+'">'
      + '<div class="ic">'+(i+1)+'</div><div><div class="t">'+s[0]+'</div><div class="d">'+s[1]+'</div></div></div>'; }).join('');
},

agree: function(){ return ''
  + '<h2>비회원 접수</h2>'
  + '<p class="guide">조회에 쓸 비밀번호를 정합니다. 회원가입은 하지 않습니다.</p>'
  + '<div class="chk all"><input type="checkbox" id="all"><label for="all" style="margin:0">전체 동의</label></div>'
  + ['[필수] 두두택배 이용약관 동의',
     '[필수] 개인정보 수집·이용 동의',
     '[필수] 만 14세 이상입니다']
    .map(function(t,i){ return '<div class="chk"><input type="checkbox" class="a" id="a'+i+'">'
      + '<label for="a'+i+'" style="margin:0;font-weight:400">'+t+'</label></div>'; }).join('')
  + '<label>조회 비밀번호<span class="req">*</span></label>'
  + '<input type="password" id="pw" placeholder="숫자 4자리" maxlength="4" inputmode="numeric">'
  + '<p class="hint">접수 후 배송조회에 씁니다.</p>';
},

sender: function(){ return ''
  + '<h2>보내는 분</h2>'
  + '<label>이름<span class="req">*</span></label><input type="text" id="s_name" placeholder="홍길동">'
  + '<label>연락처<span class="req">*</span></label><input type="tel" id="s_tel" placeholder="01012345678" inputmode="numeric">'
  + '<p class="hint">하이픈 없이 숫자만 입력합니다.</p>'
  + '<label>접수 지점<span class="req">*</span></label>'
  + '<input type="text" id="s_branch" placeholder="지점 이름을 적어주세요">'
  + '<p class="hint">등록된 지점: ' + BRANCHES.join(', ') + '</p>';
},

receiver: function(){ return ''
  + '<h2>받는 분</h2>'
  + '<label>이름<span class="req">*</span></label><input type="text" id="r_name" placeholder="김철수">'
  + '<label>연락처<span class="req">*</span></label><input type="tel" id="r_tel" placeholder="01098765432" inputmode="numeric">'
  + '<label>주소<span class="req">*</span></label><input type="text" id="r_addr" placeholder="시 구 동 번지">'
  + '<label>배송 권역<span class="req">*</span></label>'
  + '<input type="text" id="r_zone" placeholder="일반">'
  + '<p class="hint">입력할 수 있는 권역: ' + ZONES.join(', ') + '. 일반 = 제주와 도서산간을 뺀 전국.</p>'
  + '<p class="hint">셋 중 하나가 아니면 일반으로 계산합니다.</p>';
},

item: function(){ return ''
  + '<h2>물품 정보</h2>'
  + '<label>품목명<span class="req">*</span></label><input type="text" id="i_name" placeholder="예: 의류, 도서, 생활용품">'
  + '<label>실제 무게 (kg)<span class="req">*</span></label><input type="text" id="i_wt" placeholder="3" inputmode="decimal">'
  + '<label>크기 (cm)<span class="req">*</span></label>'
  + '<div class="row"><input type="text" id="i_w" placeholder="가로" inputmode="numeric">'
  + '<input type="text" id="i_h" placeholder="세로" inputmode="numeric">'
  + '<input type="text" id="i_d" placeholder="높이" inputmode="numeric"></div>'
  + '<p class="hint">요금 무게는 저울 무게와 부피 무게(가로x세로x높이/6000) 중 큰 값을 씁니다.</p>'
  + '<div id="ban"></div>';
},

fee: function(){
  var c = S.calc;
  if (!c) return '<div class="err">물품 정보가 없습니다. 앞 단계로 돌아가세요.</div>';
  if (c.over) return '<h2>접수 불가</h2>'
    + '<div class="err">대형 한도를 넘었습니다.<br>세 변의 합 ' + c.sum.toFixed(0) + 'cm (한도 160cm)<br>'
    + '요금 무게 ' + c.chargeWt.toFixed(1) + 'kg (한도 25kg)</div>'
    + '<p class="hint">크기를 줄이거나 나누어 접수하세요.</p>';
  var rows = RATE.map(function(r){
    var hit = r.grade === c.grade ? ' class="hit"' : '';
    return '<tr'+hit+'><td>'+r.grade+'</td><td>'+r.sum+'</td><td>'+r.wt+'</td>'
      + ZONES.map(function(z){ return '<td>'+r.fee[z].toLocaleString()+'</td>'; }).join('') + '</tr>';
  }).join('');
  return '<h2>요금 확인</h2>'
  + '<div class="fee">'
  + '<dl><dt>세 변의 합</dt><dd>' + c.sum.toFixed(0) + ' cm</dd></dl>'
  + '<dl><dt>실제 무게</dt><dd>' + c.real.toFixed(1) + ' kg</dd></dl>'
  + '<dl><dt>부피 무게</dt><dd>' + c.vol.toFixed(1) + ' kg</dd></dl>'
  + '<dl><dt>요금 무게 (큰 값)</dt><dd><b>' + c.chargeWt.toFixed(1) + ' kg</b></dd></dl>'
  + '<dl><dt>크기 등급</dt><dd>' + c.grade + '</dd></dl>'
  + '<dl><dt>배송 권역</dt><dd>' + c.zone + '</dd></dl>'
  + '<dl class="total"><dt>결제 금액</dt><dd>' + c.fee.toLocaleString() + '원</dd></dl>'
  + '</div>'
  + '<table class="rate"><tr><th>등급</th><th>세변합</th><th>무게</th><th>일반</th><th>제주</th><th>도서산간</th></tr>'
  + rows + '</table>';
},

done: function(){ return '<div class="ok">'
  + '<h2>접수 완료</h2>'
  + '<div class="no">' + S.waybill + '</div>'
  + '<p class="guide">운송장 번호입니다. 배송조회에 쓰세요.</p>'
  + '<div class="fee" style="text-align:left">'
  + '<dl><dt>서비스</dt><dd>' + S.service + '</dd></dl>'
  + '<dl><dt>접수 지점</dt><dd>' + (S.sender.branch||'') + '</dd></dl>'
  + '<dl><dt>도착 권역</dt><dd>' + (S.receiver.zone||'') + '</dd></dl>'
  + '<dl><dt>도착 예정</dt><dd>' + etaFor(S.receiver.zone) + ' (' + ({'일반':'다음 영업일','제주':'2영업일','도서산간':'3영업일'}[S.receiver.zone]||'-') + ')</dd></dl>'
  + '<dl class="total"><dt>결제</dt><dd>' + (S.calc ? S.calc.fee.toLocaleString()+'원' : '-') + '</dd></dl>'
  + '</div></div>';
}

};

// ---------- 하단 버튼 ----------
var NAV = {
  service:  function(){ return ''; },
  agree:    function(){ return btn('service') + '<button class="next" id="go" disabled>다음</button>'; },
  sender:   function(){ return btn('agree')    + '<button class="next" id="go">다음</button>'; },
  receiver: function(){ return btn('sender')   + '<button class="next" id="go">다음</button>'; },
  item:     function(){ return btn('receiver') + '<button class="next" id="go">요금 확인</button>'; },
  fee:      function(){ return btn('item')     + (S.calc && !S.calc.over ? '<button class="next" id="go">결제하기</button>' : ''); },
  done:     function(){ return '<button class="next" id="go">처음으로</button>'; }
};
function btn(r){ return '<button class="prev" data-go="'+r+'">이전</button>'; }

// ---------- 입력 처리 ----------
var BIND = {

service: function(){
  document.querySelectorAll('.card').forEach(function(el){
    el.onclick = function(){ S.service = el.dataset.s; go('agree'); };
  });
},

agree: function(){
  var all = document.getElementById('all'), as = document.querySelectorAll('.a'),
      pw = document.getElementById('pw'), go2 = document.getElementById('go');
  function sync(){
    var ok = Array.prototype.every.call(as, function(x){ return x.checked; }) && pw.value.length === 4;
    go2.disabled = !ok;
  }
  all.onchange = function(){ as.forEach(function(x){ x.checked = all.checked; }); sync(); };
  as.forEach(function(x){ x.onchange = function(){
    all.checked = Array.prototype.every.call(as, function(y){ return y.checked; }); sync(); }; });
  pw.oninput = sync;
  go2.onclick = function(){ S.agree = true; go('sender'); };
  prevBind();
},

sender: function(){
  // tel/branch는 setup.sql shipments 표에 대응 칸 없음(name만 sender_name과 대응) - 위 S 선언부 주석 참고
  document.getElementById('go').onclick = function(){
    S.sender = { name: val('s_name'), tel: val('s_tel').replace(/[^0-9]/g,''), branch: val('s_branch') };
    if (!S.sender.name || !S.sender.tel || !S.sender.branch) { alert('빈 칸이 있습니다.'); return; }
    go('receiver');
  };
  prevBind();
},

receiver: function(){
  // tel/addr는 setup.sql shipments 표에 대응 칸 없음(name->receiver_name, zone->region_type만 대응) - 위 S 선언부 주석 참고
  document.getElementById('go').onclick = function(){
    S.receiver = { name: val('r_name'), tel: val('r_tel').replace(/[^0-9]/g,''), addr: val('r_addr'), zone: val('r_zone') };
    if (!S.receiver.name || !S.receiver.tel || !S.receiver.addr || !S.receiver.zone) { alert('빈 칸이 있습니다.'); return; }
    go('item');
  };
  prevBind();
},

item: function(){
  var nm = document.getElementById('i_name'), box = document.getElementById('ban');
  nm.oninput = function(){
    var hits = bannedHit(nm.value);
    box.innerHTML = hits.length
      ? '<div class="err">접수 불가 품목입니다 - ' + hits.join(', ') + '<br>요금 계산 전에 거절합니다.</div>' : '';
  };
  document.getElementById('go').onclick = function(){
    var hits = bannedHit(val('i_name'));
    if (hits.length) { alert('접수 불가 품목입니다.'); return; }
    S.item = { name: val('i_name'), weight: val('i_wt'), w: val('i_w'), h: val('i_h'), d: val('i_d'), zone: S.receiver.zone };
    if (!S.item.name || !S.item.weight || !S.item.w || !S.item.h || !S.item.d) { alert('빈 칸이 있습니다.'); return; }
    S.calc = calcFee(S.item);
    go('fee');
  };
  prevBind();
},

fee: function(){
  var g = document.getElementById('go');
  if (g) g.onclick = function(){
    S.waybill = makeWaybill(S.sender.branch); // 접수규정 §9: 지점코드2+접수순번8=10자리, localStorage 누적 순번으로 중복 방지
    go('done');
  };
  prevBind();
},

done: function(){
  document.getElementById('go').onclick = function(){
    S = { service:'', agree:false, sender:{}, receiver:{}, item:{}, calc:null, waybill:'' };
    go('service');
  };
}

};
function prevBind(){
  document.querySelectorAll('[data-go]').forEach(function(b){ b.onclick = function(){ history.back(); }; });
}
function val(id){ var e = document.getElementById(id); return e ? e.value.trim() : ''; }
</script>
</body>
</html>

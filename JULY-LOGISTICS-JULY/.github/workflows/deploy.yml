name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Test API
        run: |
          echo "✅ API 코드 검증"
          node --check server.js

      - name: Deployment notification
        run: |
          echo "✅ 배포 시작됨"
          echo "🔗 Backend: https://july-logistics-backend.railway.app"
          echo "🔗 Frontend: https://dudu-reception.vercel.app"
          echo "⏳ 약 2-3분 후 프로덕션 반영"
